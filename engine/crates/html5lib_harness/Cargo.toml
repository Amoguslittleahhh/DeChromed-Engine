[package]
name = "html5lib_harness"
version.workspace = true
edition.workspace = true
publish.workspace = true
# `cargo run -p html5lib_harness` (with no `--bin`, e.g. this crate's own
# CI step and README instructions) needs a default once a package has
# more than one binary target -- `tree_construction_harness`/
# `stress_test` are extra debugging tools, not what "run this package"
# should mean by default.
default-run = "html5lib_harness"

[lib]
name = "html5lib_harness"
path = "src/lib.rs"

[[bin]]
name = "html5lib_harness"
path = "src/main.rs"

[[bin]]
name = "tree_construction_harness"
path = "src/bin/tree_construction_harness.rs"

[[bin]]
name = "stress_test"
path = "src/bin/stress_test.rs"

[lints]
workspace = true

[dependencies]
dom = { path = "../dom" }
html = { path = "../html" }
css = { path = "../css" }
xml = { path = "../xml" }
layout = { path = "../layout" }
paint = { path = "../paint" }
text = { path = "../text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
